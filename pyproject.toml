[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offgrid"
dynamic = ["version"]
description = "A free, offline, multi-agent coding team that runs against a local LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OffGrid contributors" }]
keywords = ["ai", "agents", "offline", "local-llm", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
offgrid = "offgrid.cli:main"
offgrid-launch = "offgrid.launch:main"
offgrid-setup-usb = "offgrid.fullbundle:main"

[project.urls]
Homepage = "https://site-936361bbc8d4492da54f8727d27c6b06.freebuff.page"
Source = "https://github.com/experiencingtheview/offgrid"
Issues = "https://github.com/experiencingtheview/offgrid/issues"

[tool.setuptools]
packages = ["offgrid"]

[tool.setuptools.dynamic]
version = { attr = "offgrid.__version__" }

[tool.setuptools.data-files]
"share/offgrid" = ["README.md", "LICENSE", "pyproject.toml", "OffGrid.sh", "OffGrid.command", "OffGrid.bat"]
"share/offgrid/launch" = ["launch/offgrid.sh", "launch/offgrid.command", "launch/offgrid.bat"]
"share/offgrid/scripts" = ["scripts/setup_usb.py", "scripts/fetch_library.py", "scripts/demo.py"]
