name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all tests
        run: python3 -m unittest discover -s tests -t .

  package:
    name: Installed wheel and portable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir /tmp/offgrid-dist
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/offgrid-venv
          /tmp/offgrid-venv/bin/pip install --no-deps /tmp/offgrid-dist/offgrid-*.whl
          /tmp/offgrid-venv/bin/offgrid --version
          /tmp/offgrid-venv/bin/offgrid demo --no-color
      - name: Build a bundle from the installed wheel
        run: |
          mkdir -p /tmp/offgrid-work
          /tmp/offgrid-venv/bin/offgrid distribute \
            --build /tmp/offgrid-portable.zip \
            --workspace /tmp/offgrid-work \
            --no-color --force
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("/tmp/offgrid-portable.zip").namelist()
          required = (
              "README.md", "LICENSE", "pyproject.toml", "offgrid.pyz",
              "offgrid/cli.py", "launch/offgrid.sh", "launch/offgrid.bat",
              "scripts/setup_usb.py",
          )
          for item in required:
              if not any(name.endswith(item) for name in names):
                  raise SystemExit("missing from installed-wheel bundle: " + item)
          print("installed-wheel bundle contains launchers, scripts and docs")
          PY
      - name: Run the portable app
        run: python /tmp/offgrid-portable.pyz --version

  platform-smoke:
    name: Wheel install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Check the console entry point and installed assets
        run: |
          offgrid --version
          python -c "from offgrid._bundle import assets_root; raise SystemExit(0 if assets_root() else 1)"
