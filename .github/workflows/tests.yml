name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is 26.04, which has no Python 3.9 build.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all tests
        run: python3 -m unittest discover -s tests -t .

  package:
    name: Installed wheel and portable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir /tmp/offgrid-dist
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/offgrid-venv
          /tmp/offgrid-venv/bin/pip install --no-deps /tmp/offgrid-dist/offgrid-*.whl
          /tmp/offgrid-venv/bin/offgrid --version
          /tmp/offgrid-venv/bin/offgrid-launch --version
          /tmp/offgrid-venv/bin/offgrid demo --no-color
      - name: Build a bundle from the installed wheel
        run: |
          mkdir -p /tmp/offgrid-work
          /tmp/offgrid-venv/bin/offgrid distribute \
            --build /tmp/offgrid-portable.zip \
            --workspace /tmp/offgrid-work \
            --no-color --force
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("/tmp/offgrid-portable.zip").namelist()
          required = (
              "README.md", "LICENSE", "pyproject.toml", "offgrid.pyz",
              "offgrid/cli.py", "OffGrid.sh", "OffGrid.bat",
              "launch/offgrid.sh", "launch/offgrid.bat",
              "scripts/setup_usb.py",
          )
          for item in required:
              if not any(name.endswith(item) for name in names):
                  raise SystemExit("missing from installed-wheel bundle: " + item)
          print("installed-wheel bundle contains launchers, scripts and docs")
          PY
      - name: Run the portable app
        run: python /tmp/offgrid-portable.pyz --version

  platform-smoke:
    name: Wheel install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Check the console entry point and installed assets
        run: |
          offgrid --version
          offgrid-launch --version
          python -c "from offgrid._bundle import assets_root; raise SystemExit(0 if assets_root() else 1)"

  windows_desktop:
    name: Desktop shortcut on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Create, inspect and remove a real .lnk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktopDir = Join-Path $env:RUNNER_TEMP 'offgrid-desktop-shortcut'
          $workDir = Join-Path $env:RUNNER_TEMP 'offgrid-shortcut-work'
          New-Item -ItemType Directory -Force -Path $desktopDir | Out-Null
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $probe = python -c "import sys; from pathlib import Path; print(sys.executable); print(Path.home())"
          if ($LASTEXITCODE -ne 0 -or $probe.Count -ne 2) {
            throw 'could not read the Python executable and home directory'
          }
          $expectedTarget = ([IO.Path]::GetFullPath($probe[0].Trim())).TrimEnd('\')
          $expectedWorkDir = ([IO.Path]::GetFullPath($probe[1].Trim())).TrimEnd('\')
          $expectedShortcut = Join-Path $desktopDir 'OffGrid.lnk'

          Push-Location $workDir
          try {
            $installJson = offgrid desktop install --desktop $desktopDir --json
            if ($LASTEXITCODE -ne 0) { throw 'offgrid desktop install failed' }
            $installed = $installJson | ConvertFrom-Json
            if ($installed.ok -ne $true) { throw 'install did not report success' }
            if ($installed.path -ne $expectedShortcut) {
              throw "install reported the wrong path: $($installed.path)"
            }
            if (-not (Test-Path -LiteralPath $expectedShortcut -PathType Leaf)) {
              throw "shortcut was not created: $expectedShortcut"
            }

            $shell = New-Object -ComObject WScript.Shell
            $link = $shell.CreateShortcut($expectedShortcut)
            $actualTarget = ([IO.Path]::GetFullPath($link.TargetPath)).TrimEnd('\')
            $actualWorkDir = ([IO.Path]::GetFullPath($link.WorkingDirectory)).TrimEnd('\')
            if ($actualTarget -ne $expectedTarget) {
              throw "wrong target: $actualTarget (expected $expectedTarget)"
            }
            if ($link.Arguments -ne '-m offgrid chat') {
              throw "wrong arguments: $($link.Arguments)"
            }
            if ($actualWorkDir -ne $expectedWorkDir) {
              throw "wrong working directory: $actualWorkDir (expected $expectedWorkDir)"
            }
            if ($link.Description -ne 'OffGrid offline coding team') {
              throw "wrong description: $($link.Description)"
            }

            $pathJson = offgrid desktop path --desktop $desktopDir --json
            if ($LASTEXITCODE -ne 0) { throw 'offgrid desktop path failed' }
            $found = $pathJson | ConvertFrom-Json
            if ($found.path -ne $expectedShortcut -or $found.exists -ne $true) {
              throw 'desktop path did not report the installed shortcut'
            }

            $removeJson = offgrid desktop remove --desktop $desktopDir --json
            if ($LASTEXITCODE -ne 0) { throw 'offgrid desktop remove failed' }
            $removed = $removeJson | ConvertFrom-Json
            if ($removed.removed -ne $true) { throw 'remove did not report the shortcut' }
            if (Test-Path -LiteralPath $expectedShortcut) {
              throw "shortcut still exists after removal: $expectedShortcut"
            }
          } finally {
            Pop-Location
          }

  badge:
    name: Publish public CI status
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, package, platform-smoke, windows_desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the result
        continue-on-error: true
        env:
          STATUS_URL: https://site-051bdcbe593c4975ad751c52125bd97b.freebuff.page/status
          CI_BADGE_TOKEN: ${{ secrets.CI_BADGE_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
          WINDOWS_DESKTOP_RESULT: ${{ needs.windows_desktop.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$PACKAGE_RESULT" = "success" ] && [ "$PLATFORM_RESULT" = "success" ] && [ "$WINDOWS_DESKTOP_RESULT" = "success" ]; then
            result=passing
          else
            result=failing
          fi
          python3 - "$STATUS_URL" "$result" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          url, result = sys.argv[1], sys.argv[2]
          body = json.dumps(
              {
                  "status": result,
                  "sha": os.environ["GITHUB_SHA"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["CI_BADGE_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "OffGridCI/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print(response.read().decode("utf-8"))
          PY
