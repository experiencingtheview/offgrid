name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: Build and checksum release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the full suite
        run: python3 -m unittest discover -s tests -t .
      - name: Build the Python distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Build the portable bundle
        run: |
          python -m offgrid.cli distribute \
            --build "dist/offgrid-${GITHUB_REF_NAME}-portable.zip" \
            --with-tests --force
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offgrid-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
