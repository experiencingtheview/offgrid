name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish the portable bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in offgrid/__init__.py
        run: python3 scripts/check_release_version.py "$TAG"

      - name: Build the portable bundle
        run: |
          python3 -m offgrid.cli distribute \
            --build dist/offgrid-portable.zip \
            --workspace . \
            --no-color

      - name: Check the archive before anyone downloads it
        run: |
          unzip -t dist/offgrid-portable.zip
          python3 - <<'PY'
          import stat
          import zipfile

          with zipfile.ZipFile("dist/offgrid-portable.zip") as archive:
              infos = {info.filename.rsplit("/", 1)[-1]: info for info in archive.infolist()}
              for name in ("OffGrid.sh", "OffGrid.command", "OffGrid.bat", "README-FIRST.txt"):
                  if name not in infos:
                      raise SystemExit(f"release archive is missing {name}")
              for name in ("OffGrid.sh", "OffGrid.command"):
                  mode = infos[name].external_attr >> 16
                  if not mode & stat.S_IXUSR:
                      raise SystemExit(f"{name} is not executable in the archive")
              print(f"{len(infos)} entries, launchers executable")
          PY

      - name: Write the checksum a download can be verified against
        run: |
          cd dist
          sha256sum offgrid-portable.zip > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes from CHANGELOG.md
        run: python3 scripts/changelog_notes.py "$TAG" > dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating the existing release $TAG"
            gh release upload "$TAG" dist/offgrid-portable.zip dist/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            target=()
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" dist/offgrid-portable.zip dist/SHA256SUMS "${target[@]}" \
              --title "OffGrid $TAG" \
              --notes-file dist/notes.md
          fi
          gh release view "$TAG" --json tagName,assets,url
          for asset in offgrid-portable.zip SHA256SUMS; do
            size=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$asset\") | .size")
            if [ -z "$size" ] || [ "$size" -le 0 ]; then
              echo "release $TAG has no $asset attached" >&2
              exit 1
            fi
            echo "release $TAG serves $asset ($size bytes)"
          done
