name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish the portable bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in offgrid/__init__.py
        run: python3 scripts/check_release_version.py "$TAG"

      - name: Build the portable bundle
        run: |
          python3 -m offgrid.cli distribute \
            --build dist/offgrid-portable.zip \
            --workspace . \
            --no-color

      - name: Check the archive before anyone downloads it
        run: |
          unzip -t dist/offgrid-portable.zip
          python3 - <<'PY'
          import stat
          import zipfile

          with zipfile.ZipFile("dist/offgrid-portable.zip") as archive:
              infos = {info.filename.rsplit("/", 1)[-1]: info for info in archive.infolist()}
              for name in ("OffGrid.sh", "OffGrid.command", "OffGrid.bat", "README-FIRST.txt"):
                  if name not in infos:
                      raise SystemExit(f"release archive is missing {name}")
              for name in ("OffGrid.sh", "OffGrid.command"):
                  mode = infos[name].external_attr >> 16
                  if not mode & stat.S_IXUSR:
                      raise SystemExit(f"{name} is not executable in the archive")
              print(f"{len(infos)} entries, launchers executable")
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating the existing release $TAG"
            gh release upload "$TAG" dist/offgrid-portable.zip --clobber
          else
            target=()
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" dist/offgrid-portable.zip "${target[@]}" \
              --title "OffGrid $TAG" \
              --notes "Portable download. Unzip it, then run OffGrid.command on macOS, OffGrid.bat on Windows, or OffGrid.sh on Linux. A terminal opens, the setup check reports the interpreter and finds a local model server (or explains the two free ones), and the chat starts once one answers. Needs Python 3.9+ and a local model server; no account, no key, no telemetry."
          fi
          gh release view "$TAG" --json tagName,assets,url
          size=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "offgrid-portable.zip") | .size')
          if [ -z "$size" ] || [ "$size" -le 0 ]; then
            echo "release $TAG has no offgrid-portable.zip attached" >&2
            exit 1
          fi
          echo "release $TAG serves offgrid-portable.zip ($size bytes)"
